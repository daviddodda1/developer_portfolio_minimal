    <style>
      /* 3 color theme variables */
      :root {
        --primary-color: #f5e6dc;
        --secondary-color: #2d2520;
        --accent-color: #d97856;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background-color: var(--primary-color);
        color: var(--secondary-color);
        cursor: none;
        background-image:
          linear-gradient(rgba(128, 128, 128, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(128, 128, 128, 0.05) 1px, transparent 1px);
        background-size: 30px 30px;
      }

      .main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 50%;
        max-width: 600px;
        text-align: center;
      }

      .heading {
        font-size: 4rem;
        margin-bottom: 1rem;
        font-weight: 800;
        display: inline-flex;
        justify-content: center;
        line-height: 1;
        𝚝𝚎𝚡𝚝-𝚋𝚘𝚡: 𝚝𝚛𝚒𝚖-𝚋𝚘𝚝𝚑 𝚌𝚊𝚙 𝚊𝚕𝚙𝚑𝚊𝚋𝚎𝚝𝚒𝚌;
      }

      .name-letter {
        display: inline-block;
        transform: scale(var(--scale, 1));
        transform-origin: 50% 70%;
        filter: brightness(var(--brightness, 1));
        transition:
          transform 120ms ease-out,
          filter 120ms ease-out;
        will-change: transform, filter;
      }

      .image {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 2rem;
      }

      .outerImage {
        width: 12.5rem;
        height: 12.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--primary-color);
        overflow: hidden;
        border-radius: 50%;
        border: 3px solid var(--secondary-color);
        cursor: none;
      }

      .innerImage {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }

      .profile-water-canvas {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;
        pointer-events: none;
      }

      .links {
        display: flex;
        margin-top: 1rem;
        justify-content: center;
        margin-bottom: 1rem;
        align-items: center;
      }

      .links a {
        margin-left: 0.5rem;
        margin-right: 0.5rem;
        text-align: center;
        text-decoration: none;
        width: fit-content;
        color: var(--secondary-color);
        padding: 0.5rem 1rem;
        border: 1px solid var(--secondary-color);
        border-radius: 5px;
        transition: all 0.3s ease-in-out;
        margin-top: 1rem;
        font-weight: 600;
        cursor: none;
      }

      .links a:hover {
        background-color: var(--accent-color);
        border-color: var(--accent-color);
      }

      .footer {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        padding: 1rem 0;
        font-size: 0.8rem;
      }

      .footer a {
        text-decoration: none;
        color: var(--accent-color);
      }

      /* mobile responsive */
      @media (max-width: 768px) {
        .container {
          width: 90%;
        }

        .heading {
          font-size: 3rem;
        }

        .links {
          flex-direction: column;
          gap: 0.5rem;
        }

        .links a {
          margin: 0;
          width: 100%;
          padding: 0.75rem;
        }

        .outerImage {
          width: 10rem;
          height: 10rem;
        }

        .footer {
          padding: 1rem;
        }
      }

      /* Additional breakpoint for very small screens */
      @media (max-width: 480px) {
        .heading {
          font-size: 2.5rem;
        }

        .outerImage {
          width: 8rem;
          height: 8rem;
        }

        .footer {
          font-size: 0.7rem;
        }
      }

      /* Hide custom cursor on touch devices */
      @media (hover: none) and (pointer: coarse) {
        .cursor,
        .cursor-follower {
          display: none;
        }

        body {
          cursor: auto;
        }

        a {
          cursor: pointer;
        }
      }

      .cursor {
        border-radius: 50%;
        position: fixed;
        transform: translate(-50%, -50%);
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .default-cursor {
        width: 8px;
        height: 8px;
        background-color: var(--accent-color);
        z-index: 9999;
        color: var(--primary-color);
      }

      .link-cursor {
        width: 32px;
        height: 32px;
        background-color: var(--secondary-color);
        z-index: 9999;
        color: var(--primary-color);
      }

      .link-cursor i {
        display: block;
        font-size: 1.2rem;
      }

      .cursor-follower {
        border-radius: 50%;
        position: fixed;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 999;
      }

      .default-cursor-follower {
        width: 36px;
        height: 36px;
        background-color: var(--accent-color);
        opacity: 0.2;
      }

      .link-cursor-follower {
        width: 52px;
        height: 52px;
        background-color: var(--secondary-color);
        opacity: 1;
      }

      a {
        cursor: none;
      }

      /* Easter egg styles */
      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        pointer-events: none;
        z-index: 9999;
      }

      @keyframes confetti-fall {
        to {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>

    <script type="x-shader/x-vertex" id="profileVertShader">
      precision mediump float;

      varying vec2 vUv;
      attribute vec2 a_position;

      void main() {
        vUv = .5 * (a_position + 1.);
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    </script>

    <script type="x-shader/x-fragment" id="profileFragShader">
      precision mediump float;

      varying vec2 vUv;
      uniform sampler2D u_image_texture;
      uniform float u_time;
      uniform float u_ratio;
      uniform float u_img_ratio;
      uniform float u_blueish;
      uniform float u_scale;
      uniform float u_illumination;
      uniform float u_surface_distortion;
      uniform float u_water_distortion;

      vec3 mod289(vec3 x) { return x - floor(x * (1. / 289.)) * 289.; }
      vec2 mod289(vec2 x) { return x - floor(x * (1. / 289.)) * 289.; }
      vec3 permute(vec3 x) { return mod289(((x * 34.) + 1.) * x); }

      float snoise(vec2 v) {
        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
        vec2 i = floor(v + dot(v, C.yy));
        vec2 x0 = v - i + dot(i, C.xx);
        vec2 i1 = (x0.x > x0.y) ? vec2(1., 0.) : vec2(0., 1.);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod289(i);
        vec3 p = permute(permute(i.y + vec3(0., i1.y, 1.)) + i.x + vec3(0., i1.x, 1.));
        vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.);
        m = m * m;
        m = m * m;
        vec3 x = 2. * fract(p * C.www) - 1.;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
        vec3 g;
        g.x = a0.x * x0.x + h.x * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130. * dot(m, g);
      }

      mat2 rotate2D(float r) {
        return mat2(cos(r), sin(r), -sin(r), cos(r));
      }

      float surfaceNoise(vec2 uv, float t, float scale) {
        vec2 n = vec2(.1);
        vec2 N = vec2(.1);
        mat2 m = rotate2D(.5);
        for (int j = 0; j < 10; j++) {
          uv *= m;
          n *= m;
          vec2 q = uv * scale + float(j) + n + (.5 + .5 * float(j)) * (mod(float(j), 2.) - 1.) * t;
          n += sin(q);
          N += cos(q) / scale;
          scale *= 1.2;
        }
        return (N.x + N.y + .1);
      }

      void main() {
        vec2 uv = vUv;
        uv.y = 1. - uv.y;
        uv.x *= u_ratio;

        float t = .002 * u_time;
        float outer_noise = snoise((.3 + .1 * sin(t)) * uv + vec2(0., .2 * t));
        vec2 surface_noise_uv = 2. * uv + (outer_noise * .2);

        float surface_noise = surfaceNoise(surface_noise_uv, t, u_scale);
        surface_noise *= pow(uv.y, .3);
        surface_noise = pow(surface_noise, 2.);

        vec2 img_uv = vUv;
        img_uv -= .5;
        if (u_ratio > u_img_ratio) {
          img_uv.x = img_uv.x * u_ratio / u_img_ratio;
        } else {
          img_uv.y = img_uv.y * u_img_ratio / u_ratio;
        }
        img_uv *= 1.04;
        img_uv += .5;
        img_uv.y = 1. - img_uv.y;

        img_uv += (u_water_distortion * outer_noise);
        img_uv += (u_surface_distortion * surface_noise);

        vec4 img = texture2D(u_image_texture, img_uv);
        img *= (1. + u_illumination * surface_noise);

        vec3 color = img.rgb;
        color += u_illumination * vec3(1. - u_blueish, 1., 1.) * surface_noise;
        float opacity = img.a;

        float circle_alpha = 1. - smoothstep(.485, .5, distance(vUv, vec2(.5)));

        gl_FragColor = vec4(color * circle_alpha, opacity * circle_alpha);
      }
    </script>

    <script>
      let cursorFollower = document.getElementById("cursor-follower");
      let cursor = { x: 0, y: 0 };
      let follower = { x: 0, y: 0, vx: 0, vy: 0 };

      const stiffness = 0.07; // Spring stiffness
      const damping = 0.1; // Damping coefficient

      document.addEventListener("mousemove", function (e) {
        cursor.x = e.clientX;
        cursor.y = e.clientY;
        var cursor_el = document.getElementById("cursor");
        cursor_el.style.left = e.clientX + "px";
        cursor_el.style.top = e.clientY + "px";

        if (e.target.dataset.cursor == "link") {
          cursorFollower.classList.add("link-cursor-follower");
          cursorFollower.classList.remove("default-cursor-follower");

          cursor_el.classList.add("link-cursor");
          cursor_el.classList.remove("default-cursor");
          cursor_el.innerHTML = `<i class="fa fa-${e.target.dataset.cursoricon}"></i>`;
        } else {
          cursorFollower.classList.add("default-cursor-follower");
          cursorFollower.classList.remove("link-cursor-follower");

          cursor_el.classList.add("default-cursor");
          cursor_el.classList.remove("link-cursor");
          cursor_el.innerHTML = "";
        }
      });

      const heading = document.querySelector(".heading");
      const proximityLetters = [];
      const PROXIMITY_RADIUS = 120;
      const MAX_NAME_SCALE = 0.25;
      let proximityFrame = null;
      let pointer = { x: -9999, y: -9999 };

      if (heading) {
        const name = heading.textContent;
        heading.textContent = "";

        [...name].forEach((character) => {
          const letter = document.createElement("span");
          letter.className = "name-letter";
          letter.textContent = character === " " ? "\u00a0" : character;
          heading.appendChild(letter);
          proximityLetters.push(letter);
        });
      }

      function updateNameProximity() {
        proximityFrame = null;

        proximityLetters.forEach((letter) => {
          const rect = letter.getBoundingClientRect();
          const letterX = rect.left + rect.width / 2;
          const letterY = rect.top + rect.height / 2;
          const distance = Math.hypot(pointer.x - letterX, pointer.y - letterY);
          const t = Math.max(0, 1 - distance / PROXIMITY_RADIUS);
          const eased = t * t * (3 - 2 * t);

          letter.style.setProperty(
            "--scale",
            (1 + eased * MAX_NAME_SCALE).toFixed(3),
          );
          letter.style.setProperty(
            "--brightness",
            (1 - eased * 0.22).toFixed(3),
          );
        });
      }

      document.addEventListener("pointermove", (e) => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;

        if (!proximityFrame) {
          proximityFrame = requestAnimationFrame(updateNameProximity);
        }
      });

      document.addEventListener("pointerleave", () => {
        pointer.x = -9999;
        pointer.y = -9999;
        updateNameProximity();
      });

      document.addEventListener("DOMContentLoaded", function () {
        function animate() {
          let dx = cursor.x - follower.x;
          let dy = cursor.y - follower.y;
          let springForceX = dx * stiffness;
          let springForceY = dy * stiffness;

          follower.vx *= damping;
          follower.vy *= damping;

          follower.vx += springForceX;
          follower.vy += springForceY;

          follower.x += follower.vx;
          follower.y += follower.vy;

          cursorFollower.style.left = follower.x + "px";
          cursorFollower.style.top = follower.y + "px";

          requestAnimationFrame(animate);
        }

        animate();
      });

      const PROFILE_IMAGE_WEBP = "pi.webp";
      const PROFILE_IMAGE_FALLBACK = "pi.jpg";

      function initProfileWaterEffect() {
        const canvasEl = document.getElementById("profileWaterCanvas");
        if (!canvasEl) return;

        const gl =
          canvasEl.getContext("webgl", { alpha: true }) ||
          canvasEl.getContext("experimental-webgl", { alpha: true });

        if (!gl) {
          const fallback = document.createElement("img");
          fallback.onerror = () => {
            fallback.onerror = null;
            fallback.src = PROFILE_IMAGE_FALLBACK;
          };
          fallback.src = PROFILE_IMAGE_WEBP;
          fallback.alt = "David Dodda";
          fallback.className = "innerImage";
          canvasEl.replaceWith(fallback);
          return;
        }

        const params = {
          blueish: 0.35,
          scale: 7,
          illumination: 0.12,
          surfaceDistortion: 0.045,
          waterDistortion: 0.025,
          interactionRadius: 150,
        };

        let uniforms = {};
        let waterIntensity = 0;
        let image = null;
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        function createShader(sourceCode, type) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, sourceCode);
          gl.compileShader(shader);

          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error("Profile shader compile error:", gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
          }

          return shader;
        }

        const vertexShader = createShader(
          document.getElementById("profileVertShader").textContent,
          gl.VERTEX_SHADER,
        );
        const fragmentShader = createShader(
          document.getElementById("profileFragShader").textContent,
          gl.FRAGMENT_SHADER,
        );
        if (!vertexShader || !fragmentShader) return;

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error("Profile shader link error:", gl.getProgramInfoLog(program));
          return;
        }

        gl.useProgram(program);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        const uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
        for (let i = 0; i < uniformCount; i++) {
          const uniformName = gl.getActiveUniform(program, i).name;
          uniforms[uniformName] = gl.getUniformLocation(program, uniformName);
        }

        const vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        function updateUniforms(intensity = waterIntensity) {
          gl.uniform1f(uniforms.u_blueish, params.blueish);
          gl.uniform1f(uniforms.u_scale, params.scale);
          gl.uniform1f(uniforms.u_illumination, params.illumination * intensity);
          gl.uniform1f(uniforms.u_surface_distortion, params.surfaceDistortion * intensity);
          gl.uniform1f(uniforms.u_water_distortion, params.waterDistortion * intensity);
        }

        function resizeCanvas() {
          if (!image) return;

          const rect = canvasEl.getBoundingClientRect();
          canvasEl.width = Math.max(1, Math.floor(rect.width * pixelRatio));
          canvasEl.height = Math.max(1, Math.floor(rect.height * pixelRatio));
          gl.viewport(0, 0, canvasEl.width, canvasEl.height);
          gl.uniform1f(uniforms.u_ratio, canvasEl.width / canvasEl.height);
          gl.uniform1f(uniforms.u_img_ratio, image.naturalWidth / image.naturalHeight);
        }

        image = new Image();
        image.onerror = () => {
          image.onerror = null;
          image.src = PROFILE_IMAGE_FALLBACK;
        };
        image.onload = () => {
          const texture = gl.createTexture();
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
          gl.uniform1i(uniforms.u_image_texture, 0);

          updateUniforms();
          resizeCanvas();
          render();
        };
        image.src = PROFILE_IMAGE_WEBP;

        function render() {
          const rect = canvasEl.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const distance = Math.hypot(cursor.x - centerX, cursor.y - centerY);
          const proximity = Math.max(0, 1 - distance / params.interactionRadius);
          const targetIntensity = proximity * proximity * (3 - 2 * proximity);

          waterIntensity += (targetIntensity - waterIntensity) * 0.12;

          updateUniforms(waterIntensity);
          gl.uniform1f(uniforms.u_time, performance.now());
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          requestAnimationFrame(render);
        }

        window.addEventListener("resize", resizeCanvas);
      }

      initProfileWaterEffect();

      // Easter egg: Click profile image 5 times
      let clickCount = 0;
      let clickTimer = null;
      const profileImage = document.getElementById("profileImage");

      profileImage.addEventListener("click", function (e) {
        clickCount++;

        // Reset timer
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => {
          clickCount = 0;
        }, 2000); // 2 second window to click 5 times

        if (clickCount === 5) {
          triggerEasterEgg();
          clickCount = 0;
        }
      });

      function triggerEasterEgg() {
        // Create confetti
        for (let i = 0; i < 100; i++) {
          setTimeout(() => {
            createConfetti();
          }, i * 30);
        }
      }

      function createConfetti() {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");

        // Random colors
        const colors = [
          "#d97856",
          "#f5d5c8",
          "#ff9f80",
          "#ffc896",
          "#ff6b6b",
          "#4ecdc4",
          "#45b7d1",
          "#f7b731",
        ];
        confetti.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        // Random starting position at top
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";

        // Random size
        const size = Math.random() * 10 + 5;
        confetti.style.width = size + "px";
        confetti.style.height = size + "px";

        // Random rotation and animation duration
        const duration = Math.random() * 2 + 2;
        confetti.style.animation = `confetti-fall ${duration}s linear forwards`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, duration * 1000);
      }
    </script>
