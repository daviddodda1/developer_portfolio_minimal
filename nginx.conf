events { }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /experiments/ {
            alias /usr/share/nginx/html/experiments/;
            index index.html;
        }
    }
}